# Example SEPARATE server block. Replace domain and cert paths.
# Keep your existing Next.js server block untouched.
# Place in a TLS-enabled Nginx site for chat.yourdomain.com only.
server {
    listen 443 ssl http2;
    server_name chat.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/chat.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.yourdomain.com/privkey.pem;

    # Only Sockt's WS endpoint is public on this subdomain.
    location = /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location / { return 404; }
}
# If you already configure ports 80/443 centrally, merge *carefully*;
# do NOT paste a second conflicting listen/server_name block.
