name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sockt_test
          POSTGRES_USER: sockt_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sockt_test -d sockt_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      SOCKT_TEST_DATABASE_URL: postgres://sockt_test:ci-only-password@127.0.0.1:5432/sockt_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: gofmt -d . | (! grep .)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c ./internal/updater -o /tmp/updater-windows.test.exe
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/sockt.exe ./cmd/sockt && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/sockt-updater.exe ./cmd/sockt-updater
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/sockt-amd64 ./cmd/sockt && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/socktd-amd64 ./cmd/socktd
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/sockt-arm64 ./cmd/sockt && GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/socktd-arm64 ./cmd/socktd

      - run: python3 scripts/test_release.py
      - run: |
          go build -o /tmp/sockt-test-signer ./cmd/sockt-release
          sudo bash deploy/hetzner/test-sockt-deploy.sh /tmp/sockt-test-signer
      - run: bash -n scripts/build.sh scripts/install.sh scripts/validate-release.sh deploy/hetzner/sockt-deploy
  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: { go-version-file: go.mod, cache: true }
      - name: PowerShell 5.1 and 7 installer cryptography and legacy upgrade
        shell: pwsh
        run: |
          $env:PATH = 'C:\Program Files\Git\usr\bin;' + $env:PATH
          python scripts/test_release.py
